<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Peminjaman Buku</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f7f6;
      color: #333;
    }

    header, footer {
      background-color: #a2d2ff;
      padding: 1rem;
      text-align: center;
    }

    nav {
      background-color: #cdb4db;
      padding: 0.5rem;
      text-align: center;
    }

    nav a {
      color: #333;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #a2d2ff;
      border: none;
      border-radius: 5px;
      color: #333;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #bde0fe;
      color: #333;
    }

    tbody tr:nth-child(even) {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Manajemen Perpustakaan</h1>
  </header>

  <nav>
    <a href="#">Beranda</a>
    <a href="#">Daftar Buku</a>
    <a href="#">Peminjaman</a>
    <a href="#">Pengembalian</a>
  </nav>

  <div class="container">
    <h2>Formulir Peminjaman Buku</h2>
    <form id="formPeminjaman">
      <label for="nama">Nama Peminjam</label>
      <input type="text" id="nama" required />

      <label for="judul">Judul Buku</label>
      <input type="text" id="judul" required />

      <label for="pinjam">Tanggal Peminjaman</label>
      <input type="date" id="pinjam" required />

      <label for="kembali">Tanggal Pengembalian</label>
      <input type="date" id="kembali" required />

      <button type="submit">Tambah Peminjaman</button>
    </form>

    <table id="tabelPeminjaman">
      <thead>
        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>Judul Buku</th>
          <th>Tanggal Pinjam</th>
          <th>Tanggal Kembali</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>
    <p>&copy; 2025 Perpustakaan Digital</p>
  </footer>

  <script>
    const form = document.getElementById("formPeminjaman");
    const tbody = document.querySelector("#tabelPeminjaman tbody");
    let count = 1;

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const nama = document.getElementById("nama").value;
      const judul = document.getElementById("judul").value;
      const pinjam = document.getElementById("pinjam").value;
      const kembali = document.getElementById("kembali").value;

      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${count++}</td>
        <td>${nama}</td>
        <td>${judul}</td>
        <td>${pinjam}</td>
        <td>${kembali}</td>
      `;

      form.reset();
    });
  </script>
</body>
</html>
