<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Manajemen Peminjaman Buku</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    h2 {
      color: #333;
    }
    form {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      width: 400px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 5px;
      margin-top: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
    }
  </style>
</head>
<body>

  <h2>Tambah Buku</h2>
  <form id="formBuku">
    <label for="judul">Judul Buku</label>
    <input type="text" id="judul" name="judul" required>

    <label for="penulis">Penulis</label>
    <input type="text" id="penulis" name="penulis" required>

    <label for="stok">Stok</label>
    <input type="number" id="stok" name="stok" required>

    <button type="submit">Simpan Buku</button>
  </form>

  <h2>Tambah Anggota</h2>
  <form id="formAnggota">
    <label for="nama">Nama Anggota</label>
    <input type="text" id="nama" name="nama" required>

    <button type="submit">Simpan Anggota</button>
  </form>

  <h2>Peminjaman Buku</h2>
  <form id="formPeminjaman">
    <label for="id_buku">ID Buku</label>
    <input type="number" id="id_buku" name="id_buku" required>

    <label for="id_anggota">ID Anggota</label>
    <input type="number" id="id_anggota" name="id_anggota" required>

    <label for="tgl_pinjam">Tanggal Pinjam</label>
    <input type="date" id="tgl_pinjam" name="tgl_pinjam" required>

    <label for="tgl_kembali">Tanggal Kembali</label>
    <input type="date" id="tgl_kembali" name="tgl_kembali" required>

    <button type="submit">Pinjam Buku</button>
  </form>

</body>
</html>
