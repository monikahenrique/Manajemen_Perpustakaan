<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Staf & Petugas Perpustakaan</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
      font-size: 28px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 10px;
    }

    .top-bar input[type="text"] {
      flex-grow: 1;
      padding: 12px 15px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: 0.3s;
    }

    .top-bar input[type="text"]:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }

    .top-bar a button {
      padding: 12px 25px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .top-bar a button:hover {
      background: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 14px;
      text-align: center;
    }

    th {
      background-color: #007bff;
      color: white;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background-color: #f2f6fc;
    }

    td button {
      padding: 8px 12px;
      font-size: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 2px;
      transition: 0.3s;
    }

    .btn-edit {
      background-color: #ffc107;
      color: black;
    }

    .btn-edit:hover {
      background-color: #e0a800;
    }

    .btn-delete {
      background-color: #dc3545;
      color: white;
    }

    .btn-delete:hover {
      background-color: #c82333;
    }

    .empty {
      text-align: center;
      color: #888;
      font-style: italic;
      padding: 25px;
    }

    @media (max-width: 600px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .top-bar input[type="text"],
      .top-bar a button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Manajemen Staf & Petugas Perpustakaan</h2>

    <div class="top-bar">
      <input type="text" placeholder="Cari nama atau jabatan staf...">
      <a href="tambah_staf_dan_petugas.html">
        <button>➕ Tambah Staf / Petugas</button>
      </a>
    </div>

    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>Jabatan</th>
          <th>Email</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="5" class="empty">Belum ada data staf yang ditampilkan.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
