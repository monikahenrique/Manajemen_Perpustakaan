<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Staf / Petugas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    form label {
      display: block;
      margin-top: 18px;
      font-weight: 500;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 12px 14px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }

    .btn-group {
      margin-top: 35px;
      display: flex;
      justify-content: space-between;
    }

    button {
      padding: 12px 24px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-submit {
      background-color: #007bff;
      color: white;
    }

    .btn-submit:hover {
      background-color: #0056b3;
    }

    .btn-cancel {
      background-color: #dc3545;
      color: white;
    }

    .btn-cancel:hover {
      background-color: #c82333;
    }

    @media (max-width: 500px) {
      .btn-group {
        flex-direction: column;
        gap: 10px;
      }

      .btn-group button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Form Tambah Staf / Petugas</h2>
    <form action="#" method="POST">
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

      <label for="jabatan">Jabatan</label>
      <select id="jabatan" name="jabatan" required>
        <option value="">-- Pilih Jabatan --</option>
        <option value="Kepala Perpustakaan">Kepala Perpustakaan</option>
        <option value="Petugas Peminjaman">Petugas Peminjaman</option>
        <option value="Petugas Pengembalian">Petugas Pengembalian</option>
        <option value="Petugas Katalog">Petugas Katalog</option>
      </select>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="contoh@email.com" required>

      <label for="telepon">No. HP</label>
      <input type="text" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" required>

      <div class="btn-group">
        <button type="submit" class="btn-submit">💾 Simpan</button>
        <button type="button" class="btn-cancel" onclick="window.location.href='manajemen_staf.html'">❌ Batal</button>
      </div>
    </form>
  </div>
</body>
</html>
